title: Certutil Used to Download a File
id: 1c5d6e25-4f3a-4b7c-8d9e-2f3a4b5c6d15
status: experimental
description: Detects certutil.exe being used to download files from the internet, a living-off-the-land technique used to bring in malware.
author: Tchatchoua Beltus Bejanga
date: 2026-10-06
references:
    - https://attack.mitre.org/techniques/T1105/
    - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\certutil.exe'
    selection_cli:
        CommandLine|contains:
            - 'urlcache'
            - 'verifyctl'
    selection_url:
        CommandLine|contains:
            - 'http://'
            - 'https://'
    condition: all of selection_*
fields:
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Very rare in normal use; investigate every hit
level: high
