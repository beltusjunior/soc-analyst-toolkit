title: PowerShell Executed With Encoded Command
id: 2f7b9c41-3d5e-4a8b-b6c2-7e9f0a1b2c31
status: experimental
description: Detects PowerShell started with an encoded command line argument, a common way to hide malicious scripts from casual inspection.
author: Tchatchoua Beltus Bejanga
date: 2026-10-06
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cli:
        CommandLine|contains:
            - ' -enc '
            - ' -EncodedCommand '
            - ' -ec '
            - ' -en '
    condition: all of selection_*
fields:
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Some management and deployment tools (SCCM, Intune scripts) use encoded commands; filter by parent process after review
level: high
