title: Multiple Failed Logons From a Single Source
id: 6a1c2f3e-8b7d-4e2a-9c1f-1b2d3e4f5a60
status: experimental
description: Detects a high number of failed Windows logons (Event ID 4625) from one source IP, which can indicate brute force or password spraying.
author: Tchatchoua Beltus Bejanga
date: 2026-10-06
references:
    - https://attack.mitre.org/techniques/T1110/
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    filter_local:
        IpAddress:
            - '-'
            - '127.0.0.1'
            - '::1'
    condition: selection and not filter_local
    # Correlation (count >= 10 by IpAddress within 5 minutes) is done in the SIEM;
    # see detections/queries for SPL and KQL versions.
fields:
    - IpAddress
    - TargetUserName
    - Status
    - SubStatus
falsepositives:
    - Service accounts or mapped drives using an expired saved password
    - Users repeatedly mistyping a password after a reset
level: medium
